<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site.title }}{% endblock %}</title>
    <meta name="description" content="{{ site.description }}">
    <script>
    // 在样式应用前确定主题与字号，避免刷新时闪白/跳动
    (function() {
        try {
            var t = localStorage.getItem('kepu-theme');
            if (!t) {
                t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            }
            document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
        try {
            var px = parseInt(localStorage.getItem('kepu-font-size'), 10);
            if (!px || px < 12 || px > 30) {
                // 兼容旧版的倍率设置
                var s = parseFloat(localStorage.getItem('kepu-font-scale'));
                px = (s && s > 0) ? Math.max(12, Math.min(30, Math.round(16 * s))) : 16;
            }
            document.documentElement.style.setProperty('--font-size', px + 'px');
        } catch (e) {}
    })();
    </script>
    <style>
        :root, [data-theme="light"] {
            --primary: #2c7a7b;
            --primary-light: #e6fffa;
            --accent: #ed8936;
            --bg: #f7fafc;
            --card: #ffffff;
            --text: #2d3748;
            --text-light: #718096;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
        }
        [data-theme="dark"] {
            --primary: #4fd1c5;
            --primary-light: #234e52;
            --accent: #f6ad55;
            --bg: #121826;
            --card: #1f2937;
            --text: #e2e8f0;
            --text-light: #a0aec0;
            --border: #334155;
            --shadow: 0 4px 14px rgba(0,0,0,0.4);
            color-scheme: dark;
        }
        [data-theme="dark"] header {
            background: linear-gradient(135deg, #1f2937 0%, #234e52 100%);
        }
        [data-theme="dark"] footer {
            background: #0f1420;
            color: var(--text);
            border-top: 1px solid var(--border);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
            font-size: var(--font-size, 16px);
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
        header {
            background: linear-gradient(135deg, var(--primary) 0%, #319795 100%);
            color: white;
            padding: 40px 0;
            text-align: center;
        }
        header h1 { font-size: 2.5em; margin-bottom: 10px; }
        header p { font-size: 1.1em; opacity: 0.9; }
        nav {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
        }
        nav .container { display: flex; justify-content: center; align-items: center; gap: 30px; flex-wrap: wrap; }
        nav a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            padding: 5px 15px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        nav a:hover, nav a.active { background: var(--primary-light); color: var(--primary); }
        main { padding: 20px 0; min-height: 500px; }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .card h2 { color: var(--primary); margin-bottom: 16px; font-size: 1.5em; }
        .theme-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .article-list { display: grid; gap: 20px; }
        .article-item {
            display: grid;
            grid-template-columns: 200px 1fr;
            gap: 20px;
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: transform 0.2s;
        }
        .article-item:hover { transform: translateY(-4px); }
        .article-item .cover {
            width: 100%;
            height: 100%;
            min-height: 150px;
            background: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }
        .article-item .cover img { width: 100%; height: 100%; object-fit: cover; }
        .article-item .info { padding: 20px; }
        .article-item h3 { font-size: 1.3em; margin-bottom: 8px; }
        .article-item h3 a { color: var(--text); text-decoration: none; }
        .article-item h3 a:hover { color: var(--primary); }
        .article-item .meta { color: var(--text-light); font-size: 0.9em; margin-bottom: 10px; }
        .article-item .summary { color: var(--text-light); font-size: 0.95em; }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        .theme-toggle {
            margin-left: 6px;
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.05em;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background 0.2s;
        }
        .theme-toggle:hover { transform: rotate(15deg); }
        .theme-toggle:active { transform: scale(0.9); }
        .nav-controls {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-control-label {
            color: var(--text-light);
            font-size: 0.85em;
            white-space: nowrap;
        }
        .nav-select {
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 5px 8px;
            font-family: inherit;
            font-size: 0.85em;
            line-height: 1.2;
            cursor: pointer;
            max-width: 132px;
        }
        .nav-select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
        footer {
            background: var(--text);
            color: white;
            text-align: center;
            padding: 20px 0;
            margin-top: 0;
        }
        footer p { opacity: 0.8; font-size: 0.9em; }
        @media (max-width: 768px) {
            .article-item { grid-template-columns: 1fr; }
            .article-item .cover { min-height: 180px; }
            header h1 { font-size: 1.8em; }
            .container { padding: 0 10px; }
            .card { padding: 20px 12px; }
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>{{ site.title }}</h1>
            <p>{{ site.subtitle }}</p>
        </div>
    </header>
    <nav>
        <div class="container">
            <a href="/kepu/index.html" class="{% if active == 'home' %}active{% endif %}">首页</a>
            <a href="/kepu/archive.html" class="{% if active == 'archive' %}active{% endif %}">往期回顾</a>
            <span class="nav-controls">
                <label class="nav-control-label" for="font-size-select">字号</label>
                <select id="font-size-select" class="nav-select" aria-label="正文字号" title="正文字号">
                    <option value="14">14px</option>
                    <option value="15">15px</option>
                    <option value="16">16px</option>
                    <option value="17">17px</option>
                    <option value="18">18px</option>
                    <option value="20">20px</option>
                    <option value="22">22px</option>
                    <option value="24">24px</option>
                    <option value="26">26px</option>
                    <option value="28">28px</option>
                </select>
                <label class="nav-control-label" for="tts-voice-select">音色</label>
                <select id="tts-voice-select" class="nav-select" aria-label="朗读音色" title="朗读音色">
                    <option value="zh-CN-XiaoxiaoNeural">晓晓（女）</option>
                    <option value="zh-CN-YunxiNeural">云希（男）</option>
                    <option value="zh-CN-YunyangNeural">云扬（男）</option>
                    <option value="zh-CN-XiaoyiNeural">晓伊（女）</option>
                    <option value="zh-CN-YunjianNeural">云健（男）</option>
                    <option value="zh-CN-liaoning-XiaobeiNeural">小北（东北）</option>
                    <option value="zh-CN-shaanxi-XiaoniNeural">晓妮（陕西）</option>
                    <option value="zh-TW-HsiaoChenNeural">晓臻（中国台湾）</option>
                    <option value="zh-HK-HiuMaanNeural">晓曼（中国香港）</option>
                </select>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="切换深色主题" title="切换深色主题">🌙</button>
            </span>
        </div>
    </nav>
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer>
        <div class="container">
            <p>{{ site.title }} | 每日更新，陪伴成长</p>
            <p style="margin-top:8px;opacity:0.6;font-size:0.85em">@Stong｜｜V{{ config.version }}</p>
        </div>
    </footer>
    {% block extra_js %}{% endblock %}
    <script>
    // 深色 / 浅色主题切换
    (function() {
        var btn = document.getElementById('theme-toggle');
        function reflect(theme) {
            if (!btn) return;
            var label = theme === 'dark' ? '切换浅色主题' : '切换深色主题';
            btn.textContent = theme === 'dark' ? '☀️' : '🌙';
            btn.setAttribute('aria-label', label);
            btn.title = label;
        }
        reflect(document.documentElement.getAttribute('data-theme') || 'light');
        if (btn) {
            btn.addEventListener('click', function() {
                var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', next);
                try { localStorage.setItem('kepu-theme', next); } catch (e) {}
                reflect(next);
            });
        }
    })();
    </script>
    <script>
    // 正文字号：按 px 选择，记忆用户设置
    (function() {
        var sel = document.getElementById('font-size-select');
        var px = 16;
        try {
            var saved = parseInt(localStorage.getItem('kepu-font-size'), 10);
            if (saved >= 12 && saved <= 30) {
                px = saved;
            } else {
                var s = parseFloat(localStorage.getItem('kepu-font-scale'));
                if (s && s > 0) px = Math.round(16 * s);
            }
        } catch (e) {}
        if (!sel) return;
        var options = Array.prototype.map.call(sel.options, function(o) { return parseInt(o.value, 10); })
            .filter(function(v) { return !isNaN(v); });
        if (options.indexOf(px) < 0) {
            var best = options[0];
            options.forEach(function(v) {
                if (Math.abs(v - px) < Math.abs(best - px)) best = v;
            });
            px = best;
        }
        sel.value = String(px);
        sel.addEventListener('change', function() {
            var next = parseInt(sel.value, 10) || 16;
            document.documentElement.style.setProperty('--font-size', next + 'px');
            try { localStorage.setItem('kepu-font-size', String(next)); } catch (e) {}
        });
    })();
    </script>
    <script>
    // Edge TTS 朗读音色：常用中文音色，记忆用户设置
    (function() {
        var DEFAULT_VOICE = 'zh-CN-XiaoxiaoNeural';
        var sel = document.getElementById('tts-voice-select');
        if (!sel) return;
        var saved = DEFAULT_VOICE;
        try { saved = localStorage.getItem('kepu-tts-voice') || DEFAULT_VOICE; } catch (e) {}
        sel.value = saved;
        if (!sel.value) sel.value = DEFAULT_VOICE;
        sel.addEventListener('change', function() {
            var voice = sel.value || DEFAULT_VOICE;
            try { localStorage.setItem('kepu-tts-voice', voice); } catch (e) {}
            // 通知文章页停止当前朗读并清除按旧音色缓存的音频
            try {
                window.dispatchEvent(new CustomEvent('kepu-voicechange', { detail: { voice: voice } }));
            } catch (e) {}
        });
    })();
    </script>
    <script>
    // Capacitor 环境适配
    (function() {
        if (typeof Capacitor !== 'undefined') {
            try {
                Capacitor.Plugins.StatusBar.setBackgroundColor({ color: '#2c7a7b' });
                Capacitor.Plugins.StatusBar.setStyle({ style: 'LIGHT' });
            } catch (e) {}

            document.documentElement.style.setProperty('--safe-top', 'env(safe-area-inset-top)');
            document.documentElement.style.setProperty('--safe-bottom', 'env(safe-area-inset-bottom)');
        }
    })();
    </script>
    <script src="/kepu/update-check.js"></script>
</body>
</html>
